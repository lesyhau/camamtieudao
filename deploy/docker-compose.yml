# Cam Am Tieu Dao - one service, one port. The app serves its own UI and its API on the same
# port, published on loopback, exactly like the other Proxyma services.
#
# There is no database. The app holds no state: an upload is extracted, the resulting document
# is returned to the browser, and nothing is written to disk. Session state lives in the
# encrypted auth cookie. If history is ever added, that is the point at which a `postgres`
# profile like proxyma-license's belongs here - not before.
#
# ONE optional profile:
#   COMPOSE_PROFILES=tls    adds Caddy on :80/:443 with an automatic Let's Encrypt certificate,
#                           for a host with nothing in front of it
#   COMPOSE_PROFILES=       (empty) the app alone on loopback, for the host that already runs
#                           a reverse proxy. This is the vm0/vm1 case.
#
# Profiles filter which services RUN, but Compose still INTERPOLATES every service when it
# parses this file - so a `${VAR:?msg}` marker on a service in a disabled profile would fail
# the whole stack. Profile-gated services below use plain defaults; the profile-aware
# validation lives in install.sh, which knows what is enabled.

name: camamtieudao

services:

  app:
    build: .
    image: ${CAMAM_IMAGE:-camamtieudao/app:latest}
    restart: unless-stopped
    ports:
      # Loopback by default: with a reverse proxy in front, nothing should reach this from
      # outside the host.
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-4249}:4249"
    environment:
      # --- auth (Google, for the web UI) ---
      # Optional, and unused by the Zalo release: Zalo supplies identity there. Kept configured
      # so a web front end can be turned on without touching this file. install.sh warns per
      # front end rather than these failing the whole stack.
      AUTH_URL: ${AUTH_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Comma-separated allowlist. Empty means any Google account may sign in.
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}

      # --- Zalo Official Account (the first release's front end) ---
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_OA_SECRET: ${ZALO_OA_SECRET:-}
      ZALO_OA_ACCESS_TOKEN: ${ZALO_OA_ACCESS_TOKEN:-}
      # Pin to `a` or `b` once a real webhook has confirmed which formula Zalo signs with.
      ZALO_SIGNATURE_MODE: ${ZALO_SIGNATURE_MODE:-either}
      ZALO_LOG_RAW_EVENTS: ${ZALO_LOG_RAW_EVENTS:-0}

      # --- conversion ---
      # Free tier is CPU-bound at ~13s a sheet. Two at a time on 2 vCPU leaves the event loop
      # room to keep acking webhooks.
      DEFAULT_TIER: ${DEFAULT_TIER:-free}
      OMR_CONCURRENCY: ${OMR_CONCURRENCY:-2}
      OMR_MAX_PENDING: ${OMR_MAX_PENDING:-32}

      # --- the model that reads the sheet (paid tier only) ---
      # There is no settings page by design; this is the only place the model is configured.
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-pro}
      # Only the paid tier calls a model; the free tier never leaves the box.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4249/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- OPTIONAL: bundled TLS ------------------------------------------------------------
  # Only for a host with no reverse proxy of its own. vm0/vm1 do not use this - their nginx
  # owns :443 and forwards to the loopback port above.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:-localhost}
      HTTP_PORT: ${HTTP_PORT:-4249}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
