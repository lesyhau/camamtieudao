name: CI

# Typecheck, test, build. Nothing else - deploy.yml ships.
#
# `dev` IS in the push triggers, unlike proxyma-landing's CI. There, dev pushes were covered
# by the deploy job doing the same steps first; here deploy.yml skips entirely while the
# `development` environment has no host, so without this a dev push would be validated by
# nothing at all. Once a development host exists this duplicates three steps on dev merges -
# cheap, and the alternative is a branch nobody checks.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+: the extraction core and its tests are plain .ts run through Node's own
          # type stripping, with no bundler and no ts-node. Older minors need an explicit
          # --experimental-strip-types and 20 cannot do it at all.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The M1 acceptance suite: the 叹云兮 ground truth converts end to end with no image and
      # no model involved, so a failure here is always the converter, never the extractor.
      - name: Test
        run: npm test

      - run: npm run build

      - name: Verify the standalone server was emitted
        run: test -f .next/standalone/server.js
